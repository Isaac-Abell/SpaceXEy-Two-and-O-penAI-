# Runs both services. Frontend and backend are fully separated and only talk
# over the documented HTTP/JSON API — you can also run either one alone
# (see README). Flip cheats on by setting CHEATS_ENABLED / VITE_CHEATS to true
# in BOTH services.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Allow the frontend origin (nginx on :3000) to call the API.
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
      # Cheats on both sides. Set both to "false" for a clean/production run.
      CHEATS_ENABLED: "false"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin: the browser calls /api/... on the frontend's own
        # origin and nginx proxies it to the backend (see frontend/nginx.conf).
        # This is what makes tunnels (localtunnel/ngrok) work with no CORS.
        VITE_API_BASE: ""
        VITE_CHEATS: "false"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
