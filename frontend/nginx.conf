server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the browser only ever talks to THIS origin.
    # Same-origin => no CORS, no HTTPS->HTTP mixed content, and it works behind
    # a tunnel (localtunnel/ngrok) with zero rebuilds and no CORS_ORIGINS edits.
    # Only the docker-compose image uses this file; Cloudflare Pages/Vite dev
    # don't, so their cross-origin + CORS setup is unaffected.
    # Docker's embedded DNS (127.0.0.11) + a variable upstream makes nginx
    # resolve `backend` at request time, so a backend restart can't stale it.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cheats-only config endpoint lives at the root, not under /api.
    location = /config {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: all other routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
